<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cio Bela | 20% Off</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5F0E8;
    --bark:#2C2016;
    --gold:#B8935A;
    --gold-light:#D4B896;
    --charcoal:#1A1410;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--charcoal);
    min-height:100dvh;
    display:flex;
    justify-content:center;
  }
  .hero{
    position:relative;
    width:100%;
    max-width:480px;
    min-height:100dvh;
    overflow:hidden;
  }
  .hero-photo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:50% 28%;
    z-index:0;
  }
  .scrim{position:absolute;left:0;right:0;z-index:1;pointer-events:none;}
  .scrim-top{
    top:0;height:26%;
    background:linear-gradient(to bottom, rgba(26,20,16,.5), rgba(26,20,16,0));
  }
  .scrim-bottom{
    bottom:0;height:44%;
    background:linear-gradient(to top, rgba(26,20,16,.85) 0%, rgba(26,20,16,.45) 30%, rgba(26,20,16,0) 100%);
  }
  .content{
    position:relative;
    z-index:2;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:26px 26px 30px;
    animation:riseIn .9s ease-out both;
  }
  @keyframes riseIn{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  .brand-name{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(2.4rem,9.5vw,3.2rem);
    line-height:1;
    color:var(--cream);
    letter-spacing:.01em;
  }
  .brand-sub{
    font-family:'Jost',sans-serif;
    font-weight:500;
    font-size:.66rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold-light);
    opacity:.9;
    margin-top:2px;
  }
  h1{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(2.6rem,11vw,3.6rem);
    line-height:1;
    margin:0 0 14px;
    color:var(--cream);
  }
  .instruction{
    font-family:'Jost',sans-serif;
    font-size:.95rem;
    line-height:1.5;
    color:var(--cream);
    opacity:.92;
    max-width:260px;
    margin:0 0 20px;
  }
  .cta{
    display:inline-block;
    font-family:'Jost',sans-serif;
    font-weight:500;
    font-size:1rem;
    background:var(--gold);
    color:var(--charcoal);
    padding:13px 32px;
    border-radius:3px;
    text-decoration:none;
    letter-spacing:.02em;
    transition:background .2s ease, transform .2s ease;
  }
  .cta:hover{background:var(--gold-light);transform:translateY(-1px);}
  .cta:focus-visible{outline:2px solid var(--cream);outline-offset:3px;}
  .social-label{
    font-family:'Jost',sans-serif;
    font-size:.8rem;
    color:var(--cream);
    opacity:.85;
    margin:24px 0 10px;
  }
  .social-row{
    display:flex;
    justify-content:flex-start;
    gap:14px;
  }
  .social-row a{
    width:38px;height:38px;
    border:1px solid var(--gold);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:var(--cream);
    transition:background .2s ease, color .2s ease, transform .2s ease;
  }
  .social-row a svg{width:19px;height:19px;display:block;}
  .social-row a:hover{background:var(--gold);color:var(--charcoal);transform:translateY(-2px);}
  .social-row a:focus-visible{outline:2px solid var(--gold-light);outline-offset:3px;}
  @media (prefers-reduced-motion: reduce){
    .content{animation:none;}
    .cta,.social-row a{transition:none;}
  }
</style>
</head>
