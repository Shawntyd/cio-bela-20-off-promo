<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cio Bela | 20% Off</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF;
    --charcoal:#1A1410;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--charcoal);
    min-height:100dvh;
    display:flex;
    justify-content:center;
  }
  .hero{
    position:relative;
    width:100%;
    max-width:480px;
    min-height:100dvh;
    overflow:hidden;
  }
  .hero-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:50% 50%;
    z-index:0;
  }
  .scrim-bottom{
    position:absolute;
    left:0;right:0;bottom:0;
    height:42%;
    z-index:1;
    pointer-events:none;
    background:linear-gradient(to top, rgba(26,20,16,.72) 0%, rgba(26,20,16,.38) 32%, rgba(26,20,16,0) 100%);
  }
  .content{
    position:relative;
    z-index:2;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:26px 26px 34px;
    animation:riseIn .9s ease-out both;
  }
  @keyframes riseIn{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  .offer{text-align:left;}
  h1{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(2.6rem,11vw,3.6rem);
    line-height:1;
    margin:0 0 22px;
    color:var(--white);
  }
  .checkout-note{
    font-family:'Jost',sans-serif;
    font-size:.85rem;
    letter-spacing:.04em;
    color:var(--white);
    opacity:.85;
    margin:0 0 16px;
  }
  .cta{
    display:inline-block;
    font-family:'Jost',sans-serif;
    font-weight:500;
    font-size:1rem;
    background:transparent;
    color:var(--white);
    padding:13px 22px;
    border-radius:16px;
    border:1px solid var(--white);
    text-decoration:none;
    letter-spacing:.02em;
    transition:background .2s ease, color .2s ease;
  }
  .cta:hover{background:var(--white);color:var(--charcoal);}
  .cta:focus-visible{outline:2px solid var(--white);outline-offset:3px;}
  .social-label{
    font-family:'Jost',sans-serif;
    font-size:.8rem;
    color:var(--white);
    opacity:.85;
    margin:26px 0 10px;
  }
  .social-row{
    display:flex;
    justify-content:flex-start;
    gap:14px;
  }
  .social-row a{
    width:38px;height:38px;
    border:1px solid var(--white);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:var(--white);
    transition:background .2s ease, color .2s ease, transform .2s ease;
  }
  .social-row a svg{width:19px;height:19px;display:block;}
  .social-row a:hover{background:var(--white);color:var(--charcoal);transform:translateY(-2px);}
  .social-row a:focus-visible{outline:2px solid var(--white);outline-offset:3px;}
  button.cta{cursor:pointer;appearance:none;-webkit-appearance:none;}
  .video-dim{
    position:absolute;
    inset:0;
    z-index:2;
    background:rgba(0,0,0,.45);
    opacity:0;
    pointer-events:none;
    transition:opacity .35s ease;
  }
  .video-dim.visible{opacity:1;}
  .popup-overlay{
    position:absolute;
    inset:0;
    z-index:3;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:26px;
    opacity:0;
    pointer-events:none;
    transition:opacity .35s ease;
  }
  .popup-overlay.visible{opacity:1;pointer-events:auto;}
  .popup-box{
    background:transparent;
    border:1px solid var(--white);
    border-radius:28px;
    padding:56px 26px;
    text-align:center;
    width:270px;
  }
  .popup-headline{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:600;
    font-size:2.5rem;
    line-height:1.1;
    color:var(--white);
    margin:0 0 26px;
    text-shadow:0 2px 12px rgba(0,0,0,.65);
  }
  .popup-text{
    font-family:'Jost',sans-serif;
    font-size:1.08rem;
    line-height:1.6;
    color:var(--white);
    margin:0 0 26px;
    text-shadow:0 1px 10px rgba(0,0,0,.65);
  }
  .popup-ig{
    display:inline-flex;
    width:42px;height:42px;
    border:1px solid var(--white);
    border-radius:50%;
    align-items:center;
    justify-content:center;
    color:var(--white);
    text-decoration:none;
    margin-bottom:32px;
    transition:background .2s ease, color .2s ease;
  }
  .popup-ig svg{width:21px;height:21px;}
  .popup-ig:hover{background:var(--white);color:var(--charcoal);}
  .popup-follow{
    font-family:'Jost',sans-serif;
    font-size:1.08rem;
    line-height:1.4;
    color:var(--white);
    margin:0 0 8px;
    text-shadow:0 1px 10px rgba(0,0,0,.65);
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .popup-plus{
    font-family:'Jost',sans-serif;
    font-size:.95rem;
    color:var(--white);
    opacity:.8;
    margin:0 0 10px;
    line-height:1;
  }
  .popup-note{
    font-family:'Jost',sans-serif;
    font-size:.7rem;
    letter-spacing:.02em;
    color:var(--white);
    opacity:.85;
    margin:0 0 20px;
  }
  .popup-next{
    display:inline-block;
    font-family:'Jost',sans-serif;
    font-weight:500;
    font-size:.92rem;
    background:transparent;
    color:var(--white);
    padding:10px 30px;
    border-radius:14px;
    border:1px solid var(--white);
    text-decoration:none;
    letter-spacing:.02em;
    transition:background .2s ease, color .2s ease;
  }
  .popup-next:hover{background:var(--white);color:var(--charcoal);}
  .popup-skip{
    display:block;
    font-family:'Jost',sans-serif;
    font-weight:400;
    font-size:.78rem;
    color:var(--white);
    opacity:.65;
    text-decoration:underline;
    text-underline-offset:3px;
    margin-top:16px;
  }
  .popup-skip:hover{opacity:.95;}
  @media (prefers-reduced-motion: reduce){
    .content{animation:none;}
    .cta,.social-row a,.popup-overlay,.popup-ig,.popup-next{transition:none;}
  }
</style>
</head>
<body>
  <div class="hero">
    <video class="hero-video" autoplay muted loop playsinline poster="poster.jpg">
      <source src="bg.mp4" type="video/mp4">
    </video>
    <div class="scrim-bottom"></div>
    <div class="video-dim" id="videoDim"></div>
    <div class="content">
      <div class="offer" id="mainOffer">
        <h1>20% Off</h1>
        <p class="checkout-note">Show offer at checkout</p>
        <button type="button" class="cta" id="bookNowBtn">For Rose Holders Only</button>
      </div>
      <div class="popup-overlay" id="popupOverlay">
        <div class="popup-box">
          <p class="popup-headline">Additional 10% off.</p>
          <p class="popup-follow">Follow us</p>
          <p class="popup-plus">+</p>
          <p class="popup-text">Post an image of you with your rose &amp; tag us</p>
          <p class="popup-note">Show post at checkout</p>
          <a class="popup-ig" href="https://www.instagram.com/ciobelasalon" target="_blank" rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4.3"/><circle cx="17.3" cy="6.7" r=".9" fill="currentColor" stroke="none"/></svg>
          </a>
          <br>
          <a class="popup-next" href="https://www.ciobelasalons.com" target="_blank" rel="noopener">I Posted</a>
          <a class="popup-skip" href="https://www.ciobelasalons.com" target="_blank" rel="noopener">Skip to Site</a>
        </div>
      </div>
    </div>
  </div>
<script>
  document.getElementById('bookNowBtn').addEventListener('click', function(){
    document.getElementById('mainOffer').style.display = 'none';
    document.getElementById('popupOverlay').classList.add('visible');
    document.getElementById('videoDim').classList.add('visible');
  });
</script>
</body>
</html>
